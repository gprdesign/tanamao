<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="Calendário CAL: relógio, evento escolhido e agenda semanal.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CAL">
<link rel="icon" href="../favicon.png" type="image/png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<title>CAL | Tá na mão</title>
<link rel="stylesheet" href="./cal.css?v=6">
<script src="../config.js?v=3" defer></script>
<script src="https://accounts.google.com/gsi/client" async></script>
</head>
<body>
<main id="app" aria-label="Calendário CAL">
  <section class="layout">
    <div class="left">
      <article class="tile clock"><button class="focus-trigger" type="button" data-focus="clock" aria-label="Ampliar relógio" title="Ampliar">⛶</button><strong id="clockTime">--:--</strong><span id="clockDate"></span></article>
      <article id="chosenEvent" class="tile chosen">
        <p class="hint">EVENTO ESCOLHIDO</p><button class="focus-trigger" type="button" data-focus="chosen" aria-label="Ampliar evento escolhido" title="Ampliar">⛶</button>
        <button id="chooseEvent" class="choose" type="button">Escolher evento</button>
        <div id="chosenDetails" hidden>
          <div class="event-date" id="chosenDate"></div>
          <button id="changeEvent" type="button" class="change">TROCAR</button>
          <strong id="chosenTitle"></strong>
          <div id="chosenCountdown" class="event-countdown"></div>
          <p id="chosenInfo" class="event-info"></p>
        </div>
      </article>
    </div>
    <section class="week"><div class="week-heading"><h1>AGENDA DA SEMANA</h1><button class="focus-trigger week-focus" type="button" data-focus="week" aria-label="Ampliar agenda da semana" title="Ampliar agenda">⛶</button></div><div id="weekAgenda" class="days"></div></section>
  </section>
  <div class="controls"><button id="account" type="button" aria-label="Conectar à conta do TNM" title="Conta">⇧</button><button id="refresh" type="button" aria-label="Sincronizar calendários" title="Sincronizar calendários">↻</button></div>
  <p id="status" class="status" role="status" aria-live="polite"></p>
</main>
<dialog id="picker"><div class="dialog-head"><h2>Escolha um evento</h2><button type="button" data-close="picker" aria-label="Fechar">×</button></div><p class="muted">Eventos futuros da agenda principal do TNM.</p><div id="pickerList" class="dialog-list"></div><button type="button" id="clearChoice" class="secondary">Limpar escolha</button></dialog>
<dialog id="dayDialog"><div class="dialog-head"><h2 id="dayTitle"></h2><button type="button" data-close="dayDialog" aria-label="Fechar">×</button></div><div id="dayDetails" class="dialog-list"></div></dialog>
<dialog id="focusDialog" class="focus-dialog"><div class="dialog-head"><h2 id="focusTitle"></h2><button type="button" data-close="focusDialog" aria-label="Fechar">×</button></div><div id="focusContent" class="focus-content"></div></dialog>
<dialog id="loginDialog"><form id="loginForm"><div class="dialog-head"><h2>Conectar ao TNM</h2><button type="button" data-close="loginDialog" aria-label="Fechar">×</button></div><p class="muted">Use a mesma conta do TNM para sincronizar sua agenda e evento escolhido.</p><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required><button class="primary" type="submit">Entrar</button></form></dialog>
<script src="./cal.js?v=6" defer></script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js?v=6',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});</script>
</body>
</html>
