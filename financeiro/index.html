<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0f15">
<title>Gio · Financeiro</title>
<meta name="description" content="Painel financeiro do TNM: saldo, recebimentos e contas do mês.">
<style>
:root{color-scheme:dark;--bg:#090c11;--panel:#111720;--panel2:#151d28;--line:#293343;--text:#f1f5fb;--muted:#9aa7b8;--green:#54d397;--blue:#7bb8ff;--yellow:#f0c45d;--red:#ff7d85;--purple:#b394ff;--radius:20px}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#1c2a37 0,transparent 48%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.shell{width:min(760px,100%);margin:auto;padding:20px 16px 42px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 2px 18px}.brand{font-size:.76rem;text-transform:uppercase;letter-spacing:.18em;color:var(--muted);font-weight:800}.month{font-size:.78rem;color:#d0d9e6;text-transform:capitalize}.status{font-size:.74rem;color:var(--muted);margin:0 2px 14px;min-height:1.2em}.status.error{color:var(--red)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(145deg,rgba(255,255,255,.045),transparent 55%),var(--panel);color:var(--text);text-align:left;padding:16px;min-width:0;aspect-ratio:1/1;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;box-shadow:0 12px 32px rgba(0,0,0,.18);transition:transform .14s ease,border-color .14s ease,background .14s ease}.card:hover{transform:translateY(-2px);border-color:#465873;background-color:#141d28}.card:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #94c7ff;outline-offset:3px}.card.wide{grid-column:1/-1;aspect-ratio:2.08/1;min-height:150px;max-height:245px;border-color:#42654f;background:linear-gradient(110deg,rgba(84,211,151,.12),transparent 60%),var(--panel)}.card.forecast{border-color:#665736;background:linear-gradient(145deg,rgba(240,196,93,.11),transparent 65%),var(--panel)}.card.receivable{border-color:#34546b;background:linear-gradient(145deg,rgba(123,184,255,.11),transparent 65%),var(--panel)}.card.payable{border-color:#68474a;background:linear-gradient(145deg,rgba(255,125,133,.1),transparent 65%),var(--panel)}.card.paid{border-color:#345844;background:linear-gradient(145deg,rgba(84,211,151,.1),transparent 65%),var(--panel)}.card.action{border-color:#4b4267;background:linear-gradient(145deg,rgba(179,148,255,.11),transparent 65%),var(--panel)}.eyebrow{font-size:.66rem;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);font-weight:850}.value{font-size:clamp(1.05rem,5.2vw,1.85rem);font-weight:850;line-height:1.12;letter-spacing:-.035em;overflow-wrap:anywhere}.wide .value{font-size:clamp(1.8rem,8vw,3.3rem)}.card-bottom{display:flex;align-items:end;justify-content:space-between;gap:8px}.hint{font-size:.72rem;color:var(--muted);line-height:1.35}.arrow{font-size:1.1rem;color:#b5c0d0}.login-panel{border:1px solid var(--line);border-radius:22px;padding:22px;background:var(--panel)}.login-panel h1{font-size:1.25rem;margin:0 0 7px}.login-panel p{font-size:.88rem;line-height:1.5;color:var(--muted);margin:0 0 18px}.login-panel[hidden],.grid[hidden]{display:none}.field{display:grid;gap:7px;margin:12px 0}.field label{font-size:.78rem;color:#cbd5e1;font-weight:700}.field input{width:100%;background:#0a0f16;border:1px solid #354154;color:var(--text);border-radius:12px;padding:13px;font:inherit}.btn{border:1px solid transparent;border-radius:12px;padding:13px 16px;background:#80e0aa;color:#072014;font-weight:850;font:inherit;cursor:pointer;width:100%}.btn.secondary{background:#202938;border-color:#39465a;color:#e6edf7;width:auto;padding:9px 12px;font-size:.76rem}.login-actions[hidden]{display:none}.login-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px}.login-actions .btn{flex:1}.modal{width:min(560px,calc(100vw - 26px));max-height:min(82dvh,740px);padding:0;border:1px solid #3a4658;border-radius:22px;background:#10161f;color:var(--text);box-shadow:0 26px 100px rgba(0,0,0,.65)}.modal::backdrop{background:rgba(2,5,9,.78);backdrop-filter:blur(5px)}.modal-head{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 18px 12px;background:#10161f;border-bottom:1px solid #273243}.modal-head h2{font-size:1.05rem;margin:0}.close{width:36px;height:36px;border-radius:10px;border:1px solid #39465a;background:#1a2330;color:var(--text);font-size:1.15rem;cursor:pointer}.modal-body{padding:15px 16px 18px;overflow:auto;max-height:calc(82dvh - 82px)}.modal-intro{font-size:.82rem;color:var(--muted);line-height:1.5;margin:0 0 14px}.entry-list{display:grid;gap:8px}.entry-row{display:flex;align-items:center;gap:10px;min-height:62px;padding:10px 11px;border:1px solid #2a3545;border-radius:13px;background:#151e29}.entry-main{display:grid;gap:4px;min-width:0;flex:1}.entry-main strong{font-size:.84rem;line-height:1.3;overflow-wrap:anywhere}.entry-main span{font-size:.71rem;color:var(--muted)}.entry-status{font-size:.65rem;font-weight:800;padding:5px 7px;border-radius:99px;white-space:nowrap}.entry-status.planned{color:var(--yellow);background:#43391f}.entry-status.realized{color:var(--green);background:#183c2d}.income-amount{font-size:.78rem;color:var(--green);white-space:nowrap}.mark-btn{width:36px;height:36px;flex:none;border:1px solid #347052;border-radius:11px;background:#143425;color:#83e4ae;font-size:1.12rem;font-weight:900;cursor:pointer}.mark-btn:disabled{opacity:.5}.empty{padding:18px;border:1px dashed #39465a;border-radius:13px;color:var(--muted);font-size:.82rem;text-align:center}#modalFooter:not(:empty){padding:0 16px 16px}.manage-btn{width:100%;border:1px solid #648fcd;border-radius:13px;background:#233c5b;color:#e9f3ff;padding:14px;font:inherit;font-weight:850;cursor:pointer}.wa-form{display:grid;gap:10px}.wa-form label{font-size:.8rem;font-weight:750}.wa-form input{width:100%;border:1px solid #354154;background:#0a0f16;color:var(--text);border-radius:12px;padding:13px;font:inherit}.wa-form .modal-intro{margin:4px 0}.footer-note{text-align:center;color:#69778a;font-size:.68rem;margin:15px 0 0}@media(min-width:700px){.shell{padding-top:30px}.grid{gap:16px}.card{padding:21px}.card.wide{aspect-ratio:2.8/1;max-height:270px}.status{font-size:.8rem}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
<script src="../config.js"></script>
</head>
<body>
<main class="shell">
  <header class="top"><div class="brand">Zapia · Financeiro</div><div class="month" id="monthLabel">Este mês</div></header>
  <p class="status" id="status" role="status" aria-live="polite">Carregando…</p>
  <section class="login-panel" id="loginPanel" hidden>
    <h1>Entrar no TNM</h1><p>Use a conta do TNM para consultar seus saldos e atualizar lançamentos. A senha é usada apenas no login e não é salva nesta página.</p>
    <form id="loginForm"><div class="field"><label for="email">E-mail do TNM</label><input id="email" name="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button class="btn" type="submit">Entrar e carregar</button></form>
  </section>
  <section class="grid" id="dashboard" hidden aria-label="Painel financeiro">
    <button class="card wide" id="accountCard" type="button"><span class="eyebrow">Saldo em conta atual</span><span class="value" id="accountValue">—</span><span class="card-bottom"><span class="hint" id="accountUpdated">Banco Jota · aguardando atualização</span><span class="arrow" aria-hidden="true">↗</span></span></button>
    <button class="card forecast" id="forecastCard" type="button"><span class="eyebrow">Saldo previsto</span><span class="value" id="forecastValue">—</span><span class="card-bottom"><span class="hint" id="forecastNote">Recebimentos pendentes deste mês</span><span class="arrow" aria-hidden="true">↗</span></span></button>
    <button class="card receivable" id="receivableCard" type="button"><span class="eyebrow">Valores a receber</span><span class="value" id="receivableValue">—</span><span class="card-bottom"><span class="hint" id="receivableCount">Mês vigente</span><span class="arrow" aria-hidden="true">↗</span></span></button>
    <button class="card payable" id="payableCard" type="button"><span class="eyebrow">Contas a pagar</span><span class="value" id="payableValue">—</span><span class="card-bottom"><span class="hint" id="payableCount">Mês vigente</span><span class="arrow" aria-hidden="true">↗</span></span></button>
    <button class="card paid" id="paidCard" type="button"><span class="eyebrow">Contas pagas</span><span class="value" id="paidValue">—</span><span class="card-bottom"><span class="hint" id="paidCount">Mês vigente</span><span class="arrow" aria-hidden="true">↗</span></span></button>
    <button class="card action" id="chargeCard" type="button"><span class="eyebrow">Realizar cobrança</span><span class="value">Cobrar cliente</span><span class="card-bottom"><span class="hint">Preparar mensagem no WhatsApp</span><span class="arrow" aria-hidden="true">↗</span></span></button>
    <button class="card action" id="paymentCard" type="button"><span class="eyebrow">Realizar pagamento</span><span class="value">Iniciar pagamento</span><span class="card-bottom"><span class="hint">Preparar mensagem no WhatsApp</span><span class="arrow" aria-hidden="true">↗</span></span></button>
  </section>
  <div class="login-actions" id="accountActions" hidden><button class="btn secondary" id="refreshBtn" type="button">Atualizar</button><button class="btn secondary" id="signOut" type="button">Sair</button></div>
  <p class="footer-note">Dados financeiros privados · acesso protegido pelo login e RLS do TNM</p>
</main>
<dialog class="modal" id="modal" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle"></h2><button class="close" id="modalClose" type="button" aria-label="Fechar">×</button></div><div class="modal-body" id="modalBody"></div><div id="modalFooter"></div></dialog>
<script src="dashboard.js?v=1"></script>
</body>
</html>
